readme = "README.md"
authors = [
    { name = "Suxingyu111", email = "105139593+Suxingyu111@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cos-python-sdk-v5>=1.9.44",
    "docling>=2.145.0",
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
